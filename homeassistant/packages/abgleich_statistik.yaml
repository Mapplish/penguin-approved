# GENERATED room/HP statistics for the balancing evaluation
# (homeassistant/packages/abgleich.yaml reads these). Entity ids follow
# sensor.abgleich_<key>_48h / _nacht; the keys must match the room list
# in sensor.abgleich_raeume. Room -> sensor mapping confirmed by the user
# 2026-11-22; *_rauchmelder_* sources are ceiling-mounted smoke detectors
# used as a stand-in until a room thermometer exists (read high).
#
# _48h  : rolling 48 h window, compared before/after each balancing step.
# _nacht: rolling 2 h window, snapshotted at 05:00 -> night value 03-05 h.
# _24h  : rolling 24 h window for the daily mail.
# Median/mean are per sample, not time-weighted (good enough here).

sensor:
  # --- Room temperatures, 48 h median ---
  - platform: statistics
    name: "Abgleich Schlafzimmer 48h"
    unique_id: abgleich_schlafzimmer_48h
    entity_id: sensor.schlafzimmer_temperatur_temperature
    state_characteristic: median
    max_age:
      hours: 48
    sampling_size: 5000
    keep_last_sample: true
    precision: 2
