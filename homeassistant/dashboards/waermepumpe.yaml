title: Wärmepumpe
views:
  - title: Übersicht
    path: overview
    icon: mdi:heat-pump
    cards:
      - type: entities
        title: Aktueller Betrieb
        show_header_toggle: false
        entities:
          - entity: sensor.heating_ebusd_hmu_currentconsumedpower
            name: Stromaufnahme
          - entity: sensor.heating_ebusd_hmu_currentyieldpower
            name: Heizleistung
          - entity: sensor.heating_ebusd_hmu_flowtemp
            name: Vorlauf
          - entity: sensor.heating_ebusd_hmu_supplytempweighted
            name: Gewichteter Vorlauf
          - entity: sensor.heating_ebusd_broadcast_outsidetemp
            name: Außentemperatur

      # One tuple per heating circuit: (room name, return sensor, spread
      # sensor from configuration.yaml). First row is the heat pump's own
      # return (total over all circuits). Room names are display-only, the
      # ESPHome names stay the physical labels at the distributor.
      - type: markdown
        title: Heizen
        content: |
          {%- macro fmt(e, unit) -%}
          {{ (states(e) | float | round(1) | string | replace('.', ',') ~ ' ' ~ unit) if is_number(states(e)) else '–' }}
          {%- endmacro -%}
          **Heizvorlauf:** {{ fmt('sensor.heizvorlauf', '°C') if is_number(states('sensor.heizvorlauf')) else 'kein Heizbetrieb' }}

          | Raum | Rücklauf | Spreizung |
          |:--|--:|--:|
          {%- for room, rl, sp in [
            ('Wärmepumpe', 'sensor.heizruecklauf', 'sensor.spreizung_waermepumpe'),
            ('Kaminzimmer 1', 'sensor.esp_verteiler_heizungsraum_ruecklauf_kreis_oben', 'sensor.spreizung_kaminzimmer_1'),
            ('Kaminzimmer 2', 'sensor.esp_verteiler_heizungsraum_ruecklauf_kreis_unten', 'sensor.spreizung_kaminzimmer_2'),
          ] %}
          | {{ room }} | {{ fmt(rl, '°C') }} | {{ fmt(sp, 'K') }} |
          {%- endfor %}

  - title: Einstellungen
    path: einstellungen
    icon: mdi:tune
    cards:
      - type: entities
        title: Heizkreis 1
        show_header_toggle: false
        entities:
          - entity: sensor.heating_ebusd_ctlv2_z1opmode
            name: Modus
          - entity: sensor.heating_ebusd_ctlv2_z1daytemp
            name: Wunschtemperatur (Heizen)
          - entity: sensor.heating_ebusd_ctlv2_z1nighttemp
            name: Absenktemperatur
          - entity: sensor.heating_ebusd_ctlv2_z1holidaytemp
            name: Urlaubstemperatur (ungeprüft)
          - entity: sensor.heating_ebusd_ctlv2_z1quickvetotemp
            name: Kurzzeit-Veto-Temperatur (ungeprüft)
          - entity: sensor.heating_ebusd_ctlv2_z1coolingtemp
            name: Wunschtemperatur (Kühlen)
          - entity: sensor.heating_ebusd_ctlv2_z1sfmode
            name: Sonderfunktion-Modus (ungeprüft)
          - entity: sensor.heating_ebusd_ctlv2_hc1heatcurve
            name: Heizkurve
          - entity: sensor.heating_ebusd_ctlv2_hc1heatcurveadaption
            name: Heizkurve-Adaption (ungeprüft)
          - entity: sensor.heating_ebusd_ctlv2_hc1minflowtempdesired
            name: Min. Vorlaufsolltemperatur
          - entity: sensor.heating_ebusd_ctlv2_hc1maxflowtempdesired
            name: Max. Vorlaufsolltemperatur
          - entity: sensor.heating_ebusd_ctlv2_hc1mincoolingtempdesired
            name: Min. Vorlaufsolltemp. Kühlen
          - entity: sensor.heating_ebusd_ctlv2_hc1summertemplimit
            name: AT-Abschaltgrenze
          - entity: sensor.heating_ebusd_ctlv2_hc1autooffmode
            name: Absenkmodus
          - entity: sensor.heating_ebusd_ctlv2_hc1excesstemp
            name: Überschusstemperatur (ungeprüft)
          - entity: sensor.heating_ebusd_ctlv2_hc1roomtempswitchon
            name: Raumaufschaltung

      - type: entities
        title: Warmwasser
        show_header_toggle: false
        entities:
          - entity: sensor.heating_ebusd_ctlv2_hwcopmode
            name: Modus
          - entity: sensor.heating_ebusd_ctlv2_hwctempdesired
            name: Warmwassertemperatur
          - entity: sensor.heating_ebusd_ctlv2_hwcmaxflowtempdesired
            name: Max. Vorlaufsolltemp. WW
          - entity: sensor.heating_ebusd_ctlv2_hwcsfmode
            name: Warmwasser schnell

      - type: entities
        title: Wärmepumpe (Live-Sollwerte, kein Menüpunkt)
        show_header_toggle: false
        entities:
          - entity: sensor.heating_ebusd_hmu_setmode_hcmode
            name: Heizkreis-Modus
          - entity: sensor.heating_ebusd_hmu_setmode_flowtempdesired
            name: Vorlauf-Sollwert
          - entity: sensor.heating_ebusd_hmu_setmode_hwctempdesired
            name: Warmwasser-Sollwert
          - entity: sensor.heating_ebusd_hmu_setmode_hwcflowtempdesired
            name: Warmwasser-Vorlauf-Sollwert
          - entity: sensor.heating_ebusd_hmu_setmode_disablehc
            name: Heizkreis gesperrt
          - entity: sensor.heating_ebusd_hmu_setmode_disablehwctapping
            name: Warmwasser-Zapfung gesperrt
          - entity: sensor.heating_ebusd_hmu_setmode_disablehwcload
            name: Warmwasser-Beladung gesperrt
          - entity: sensor.heating_ebusd_hmu_setmode_remotecontrolhcpump
            name: Fernsteuerung Heizungspumpe
          - entity: sensor.heating_ebusd_hmu_setmode_releasebackup
            name: Backup-Heizstab freigegeben
          - entity: sensor.heating_ebusd_hmu_setmode_releasecooling
            name: Kühlung freigegeben

      - type: entities
        title: Allgemein
        show_header_toggle: false
        entities:
          - entity: sensor.heating_ebusd_ctlv2_maxroomhumidity
            name: Max. Raumluftfeuchte
          - entity: sensor.heating_ebusd_ctlv2_adaptheatcurve
            name: Adaptive Heizkurve

  - title: Statistik
    path: statistik
    icon: mdi:chart-line
    cards:
      - type: entities
        title: COP – Gesamt
        show_header_toggle: false
        entities:
          - entity: sensor.heat_pump_cop
            name: Momentan-COP
          - entity: sensor.heat_pump_cop_daily
            name: Tagesmittel-COP

      - type: entities
        title: COP – Heizen
        show_header_toggle: false
        entities:
          - entity: sensor.heat_pump_cop_heizen
            name: Momentan-COP
          - entity: sensor.heat_pump_cop_heizen_kumuliert
            name: COP (kumuliert seit Erfassung)

      - type: entities
        title: COP – Warmwasser
        show_header_toggle: false
        entities:
          - entity: sensor.heat_pump_cop_warmwasser
            name: Momentan-COP
          - entity: sensor.heat_pump_cop_warmwasser_kumuliert
            name: COP (kumuliert seit Erfassung)

      - type: entities
        title: COP – Kühlen (ungeprüft)
        show_header_toggle: false
        entities:
          - entity: sensor.heat_pump_cop_kuehlen
            name: Momentan-COP (ungeprüft)
          - entity: sensor.heat_pump_cop_kuehlen_kumuliert
            name: COP kumuliert (ungeprüft)

      - type: entities
        title: Energie (heute, gesamt)
        show_header_toggle: false
        entities:
          - entity: sensor.waermepumpe_stromverbrauch_taeglich
            name: Stromverbrauch
          - entity: sensor.waermepumpe_waermeertrag_taeglich
            name: Wärmeertrag
          - entity: sensor.compressor_runtime_per_start
            name: Verdichter-Laufzeit je Start

      - type: entities
        title: Energie je Betriebsart (kumuliert seit Erfassung)
        show_header_toggle: false
        entities:
          - entity: sensor.waermepumpe_strom_heizen_kumuliert
            name: Strom Heizen
          - entity: sensor.waermepumpe_ertrag_heizen_kumuliert
            name: Wärmeertrag Heizen
          - entity: sensor.waermepumpe_strom_warmwasser_kumuliert
            name: Strom Warmwasser
          - entity: sensor.waermepumpe_ertrag_warmwasser_kumuliert
            name: Wärmeertrag Warmwasser
          - entity: sensor.waermepumpe_strom_kuehlen_kumuliert
            name: Strom Kühlen (ungeprüft)
          - entity: sensor.waermepumpe_ertrag_kuehlen_kumuliert
            name: Wärmeertrag Kühlen (ungeprüft)

      - type: statistics-graph
        title: COP-Verlauf (30 Tage)
        period: day
        days_to_show: 30
        stat_types:
          - mean
        entities:
          - sensor.heat_pump_cop
          - sensor.heat_pump_cop_heizen
          - sensor.heat_pump_cop_warmwasser
          - sensor.heat_pump_cop_kuehlen

      - type: statistics-graph
        title: Energie-Verlauf (30 Tage)
        period: day
        days_to_show: 30
        stat_types:
          - sum
        entities:
          - sensor.waermepumpe_stromverbrauch
          - sensor.waermepumpe_waermeertrag

