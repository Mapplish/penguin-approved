title: Raumklima
views:
  - title: Übersicht
    path: overview
    icon: mdi:home-thermometer
    cards:
      - type: entities
        title: Außen (Referenz)
        show_header_toggle: false
        entities:
          - entity: sensor.aussen_temperatur_temperature
            name: Temperatur
          - entity: sensor.aussen_temperatur_humidity
            name: Luftfeuchtigkeit

      - type: markdown
        title: Raumklima-Bewertung
        content: |
          {% set a = 17.62 %}
          {% set b = 243.12 %}
          {% set target = 21 %}
          {% set tol = 1.5 %}
          {% set rooms = [
            {'name': 'Baby', 't': 'sensor.baby_temperatur_temperature', 'h': 'sensor.baby_temperatur_humidity'},
            {'name': 'Badezimmer', 't': 'sensor.badezimmer_temperatur_temperature', 'h': 'sensor.badezimmer_temperatur_humidity'},
            {'name': 'Bar', 't': 'sensor.bar_temperatur_temperature', 'h': 'sensor.bar_temperatur_humidity'},
            {'name': 'Büro', 't': 'sensor.buro_temperatur_temperature', 'h': 'sensor.buro_temperatur_humidity'},
            {'name': 'Eingang', 't': 'sensor.eingang_temperatur_temperature', 'h': 'sensor.eingang_temperatur_humidity'},
            {'name': 'Esszimmer', 't': 'sensor.esszimmer_temperatur_temperature', 'h': 'sensor.esszimmer_temperatur_humidity'},
            {'name': 'Gäste-WC', 't': 'sensor.gastewc_temperatur_temperature', 'h': 'sensor.gastewc_temperatur_humidity'},
            {'name': 'Küche', 't': 'sensor.kuche_temperatur_temperature', 'h': 'sensor.kuche_temperatur_humidity'},
            {'name': 'Schlafzimmer', 't': 'sensor.schlafzimmer_temperatur_temperature', 'h': 'sensor.schlafzimmer_temperatur_humidity'},
            {'name': 'Wohnzimmer', 't': 'sensor.wohnzimmer_temperatur_temperature', 'h': 'sensor.wohnzimmer_temperatur_humidity'}
          ] %}
          {% set ns = namespace(dewpoints=[]) %}

          **Zielwert:** {{ target }} °C ± {{ tol }} °C &nbsp;·&nbsp; Feuchte optimal 30–60 %


          | Raum | Temperatur | Feuchte | Taupunkt |
          |---|---|---|---|
          {% for r in rooms -%}
          {%- set t = states(r.t) | float(None) -%}
          {%- set h = states(r.h) | float(None) -%}
          {%- if t is not none and h is not none and h > 0 -%}
          {%- set alpha = (a * t / (b + t)) + log(h / 100) -%}
          {%- set td = (b * alpha / (a - alpha)) | round(1) -%}
          {%- set ns.dewpoints = ns.dewpoints + [td] -%}
          {%- set temp_status = '🔵 zu kühl' if t < target - tol else ('🔴 zu warm' if t > target + tol else '🟢 im Zielbereich') -%}
          {%- set hum_status = '🟡 trocken' if h < 30 else ('🟢 optimal' if h <= 60 else ('🟠 erhöht' if h <= 70 else '🔴 Schimmelrisiko')) -%}
          | {{ r.name }} | {{ t }} °C {{ temp_status }} | {{ h }} % {{ hum_status }} | {{ td }} °C |
          {% else -%}
          | {{ r.name }} | – | – | – |
          {% endif -%}
          {% endfor %}


          {% set out_t = states('sensor.aussen_temperatur_temperature') | float(None) %}
          {% set out_h = states('sensor.aussen_temperatur_humidity') | float(None) %}
          {% set avg_td = (ns.dewpoints | sum / ns.dewpoints | length) | round(1) if ns.dewpoints | length > 0 else None %}
          {% if out_t is not none and out_h is not none and out_h > 0 and avg_td is not none %}
          {% set out_alpha = (a * out_t / (b + out_t)) + log(out_h / 100) %}
          {% set out_td = (b * out_alpha / (a - out_alpha)) | round(1) %}

          **Taupunkt Außen:** {{ out_td }} °C &nbsp;·&nbsp; **Ø Taupunkt Innen:** {{ avg_td }} °C


          {% if out_td < avg_td - 1 %}
          ✅ Lüften empfohlen (Außenluft ist trockener als die Innenluft)
          {% elif out_td > avg_td + 1 %}
          ⏸️ Lüften bringt aktuell mehr Feuchtigkeit rein als raus
          {% else %}
          ➖ Lüften macht aktuell kaum einen Unterschied
          {% endif %}
          {% else %}
          ⚠️ Nicht genug Daten für eine Lüftungsempfehlung
          {% endif %}


          *Schimmelrisiko-Einstufung ist eine Faustregel auf Basis relativer Feuchte (>70 %); ohne Wandoberflächentemperatur kein exakter Kondensationswert.*

