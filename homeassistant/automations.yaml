- id: '1770557446099'
  alias: Wasseralarm – Auslösen
  description: >-
    Rings the phones via the Android alarm stream (bypasses DND/silent) every
    minute until acknowledged or every leak sensor is dry again.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.waschraum_leckage_water_leak
    - binary_sensor.kuche_leckage_water_leak
    - binary_sensor.badezimmer_leckage_water_leak
    - binary_sensor.hobbyraum_leckage_water_leak
    - binary_sensor.heizungsraum_leckage_water_leak
    - binary_sensor.bar_leckage_water_leak
    to: 'on'
  actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.wasseralarm_gequittiert
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.wasseralarm_gequittiert
        state: 'off'
      - condition: template
        value_template: '{{ leak_sensors | select(''is_state'', ''on'') | list | count > 0 }}'
      sequence:
      - action: notify.ha_alarm_phones
        data:
          title: "\U0001F6A8 Wasserleck erkannt!"
          message: >-
            Nass: {{ leak_sensors | select('is_state', 'on')
            | map('state_attr', 'friendly_name')
            | map('regex_replace', '(?i) leckage moisture$', '') | join(', ') }}
            (seit {{ as_timestamp(start) | timestamp_custom('%H:%M') }})
          data:
            channel: alarm_stream
            ttl: 0
            priority: high
            persistent: true
            sticky: 'true'
            tag: '{{ alarm_tag }}'
            actions:
            - action: ACK_WATER
              title: Quittieren
      - delay: 00:01:00
  mode: restart
  variables:
    alarm_tag: wasseralarm
    start: '{{ now() }}'
    leak_sensors:
    - binary_sensor.waschraum_leckage_water_leak
    - binary_sensor.kuche_leckage_water_leak
    - binary_sensor.badezimmer_leckage_water_leak
    - binary_sensor.hobbyraum_leckage_water_leak
    - binary_sensor.heizungsraum_leckage_water_leak
    - binary_sensor.bar_leckage_water_leak
- id: '1770559676763'
  alias: Wasseralarm – Quittieren (Smartphone)
  description: ''
  triggers:
  - event_type: mobile_app_notification_action
    event_data:
      action: ACK_WATER
    trigger: event
  actions:
  - target:
      entity_id: input_boolean.wasseralarm_gequittiert
    action: input_boolean.turn_on
  - data:
      message: clear_notification
      data:
        tag: '{{ alarm_tag }}'
    action: notify.ha_alarm_phones
  mode: single
  variables:
    alarm_tag: wasseralarm
- id: '1770559713174'
  alias: Wasseralarm – Rückkehr zu normal
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.waschraum_leckage_water_leak
    - binary_sensor.kuche_leckage_water_leak
    - binary_sensor.badezimmer_leckage_water_leak
    - binary_sensor.hobbyraum_leckage_water_leak
