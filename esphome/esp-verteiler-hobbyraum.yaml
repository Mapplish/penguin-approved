esphome:
  name: esp-verteiler-hobbyraum
  friendly_name: esp-verteiler-hobbyraum

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret esp_verteiler_hobbyraum_api_key

ota:
  - platform: esphome
    password: !secret esp_verteiler_hobbyraum_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: esp-hobbyraum Fallback
    password: !secret esp_verteiler_hobbyraum_ap_password

captive_portal:

# Ein 1-Wire-Bus pro Verteiler-Strang
one_wire:
  - platform: gpio
    pin: GPIO17    # EG
    id: bus_eg
  - platform: gpio
    pin: GPIO4     # OG
    id: bus_og
  - platform: gpio
    pin: GPIO16    # UG
    id: bus_ug

sensor:
  - platform: wifi_signal
    name: "WiFi Signal Hobbyraum"
    update_interval: 60s

  # Ruecklauftemperaturen: alle 10 s messen, 1-Minuten-Mittelwert an HA.
  # Nummerierung = Position am Verteiler, links nach rechts.

  # ---------- EG (GPIO17) ----------
  - platform: dallas_temp
    one_wire_id: bus_eg
    address: 0x1d000000d686a028
    name: "EG_01 Ruecklauf"   # Klarname:
    update_interval: 10s
    filters: [{sliding_window_moving_average: {window_size: 6, send_every: 6}}]
