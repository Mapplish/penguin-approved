sensor:
  - platform: avanza_stock
    stock:
      - id: 1063827
        name: Holy Grail (A2PKXG)

  - platform: integration
    source: sensor.heating_ebusd_hmu_currentconsumedpower
    name: "Wärmepumpe Stromverbrauch"
    unique_id: waermepumpe_stromverbrauch
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.heating_ebusd_hmu_currentyieldpower
    name: "Wärmepumpe Wärmeertrag"
    unique_id: waermepumpe_waermeertrag
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_strom_heizen
    name: "Wärmepumpe Strom Heizen (kumuliert)"
    unique_id: waermepumpe_strom_heizen_kumuliert
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_ertrag_heizen
    name: "Wärmepumpe Ertrag Heizen (kumuliert)"
    unique_id: waermepumpe_ertrag_heizen_kumuliert
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_strom_warmwasser
    name: "Wärmepumpe Strom Warmwasser (kumuliert)"
    unique_id: waermepumpe_strom_warmwasser_kumuliert
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_ertrag_warmwasser
    name: "Wärmepumpe Ertrag Warmwasser (kumuliert)"
    unique_id: waermepumpe_ertrag_warmwasser_kumuliert
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_strom_kuehlen
    name: "Wärmepumpe Strom Kühlen (kumuliert)"
    unique_id: waermepumpe_strom_kuehlen_kumuliert
    unit_prefix: k
    unit_time: h
    method: trapezoidal
    round: 3

  - platform: integration
    source: sensor.waermepumpe_ertrag_kuehlen
    name: "Wärmepumpe Ertrag Kühlen (kumuliert)"
    unique_id: waermepumpe_ertrag_kuehlen_kumuliert
