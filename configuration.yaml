# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include homeassistant/automations.yaml
script: !include homeassistant/scripts.yaml
scene: !include homeassistant/scenes.yaml

notify:
  - platform: group
    name: ha_alarm_phones
    services:
      - service: mobile_app_pixel_9a
      - service: mobile_app_cph2211

template:
  - sensor:
      - name: "Next Cover Automation"
        state: >
          {% set now_ts = as_timestamp(now()) %}
          {% set dawn_ts = as_timestamp(state_attr('sun.sun', 'next_dawn')) %}
          {% set dusk_ts = as_timestamp(state_attr('sun.sun', 'next_dusk')) %}
          {% set today = now().date() %}

          {% set earliest_ts = as_timestamp(today ~ " 06:00:00") %}
          {% set latest_ts = as_timestamp(today ~ " 21:00:00") %}

          {% set adjusted_dawn = [dawn_ts, earliest_ts]|max %}
          {% set adjusted_dusk = [dusk_ts, latest_ts]|min %}

          {% if adjusted_dawn > now_ts and (adjusted_dawn < adjusted_dusk or adjusted_dusk <= now_ts) %}
            Cover opening at {{ adjusted_dawn | timestamp_custom('%H:%M') }}
          {% else %}
            Cover closing at {{ adjusted_dusk | timestamp_custom('%H:%M') }}
          {% endif %}
        attributes:
          next_event: >
            {% set now_ts = as_timestamp(now()) %}
            {% set dawn_ts = as_timestamp(state_attr('sun.sun', 'next_dawn')) %}
            {% set dusk_ts = as_timestamp(state_attr('sun.sun', 'next_dusk')) %}
            {% set today = now().date() %}

            {% set earliest_ts = as_timestamp(today ~ " 06:00:00") %}
            {% set latest_ts = as_timestamp(today ~ " 21:00:00") %}

            {% set adjusted_dawn = [dawn_ts, earliest_ts]|max %}
            {% set adjusted_dusk = [dusk_ts, latest_ts]|min %}

            {% if adjusted_dawn > now_ts and (adjusted_dawn < adjusted_dusk or adjusted_dusk <= now_ts) %}
              {{ adjusted_dawn | timestamp_custom('%Y-%m-%dT%H:%M:%S') }}
            {% else %}
              {{ adjusted_dusk | timestamp_custom('%Y-%m-%dT%H:%M:%S') }}
            {% endif %}
          next_action: >
            {% set now_ts = as_timestamp(now()) %}
            {% set dawn_ts = as_timestamp(state_attr('sun.sun', 'next_dawn')) %}
            {% set dusk_ts = as_timestamp(state_attr('sun.sun', 'next_dusk')) %}
            {% set today = now().date() %}

            {% set earliest_ts = as_timestamp(today ~ " 06:00:00") %}
            {% set latest_ts = as_timestamp(today ~ " 21:00:00") %}

            {% set adjusted_dawn = [dawn_ts, earliest_ts]|max %}
            {% set adjusted_dusk = [dusk_ts, latest_ts]|min %}

            {% if adjusted_dawn > now_ts and (adjusted_dawn < adjusted_dusk or adjusted_dusk <= now_ts) %}
              opening
            {% else %}
              closing
            {% endif %}
  - sensor:
      - name: "Heat Pump COP"
        unique_id: heat_pump_cop
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.heating_ebusd_hmu_currentyieldpower') | float(0) %}
          {% set power = states('sensor.heating_ebusd_hmu_currentconsumedpower') | float(0) %}
          {% if power > 0 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:heat-pump

      - name: "Heat Pump COP Daily"
        unique_id: heat_pump_cop_daily
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_waermeertrag_taeglich') | float(0) %}
          {% set power = states('sensor.waermepumpe_stromverbrauch_taeglich') | float(0) %}
          {% if power > 0.05 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:heat-pump-outline

      - name: "Wärmepumpe Strom Heizen"
        unique_id: waermepumpe_strom_heizen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'heat_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentconsumedpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Wärmepumpe Ertrag Heizen"
        unique_id: waermepumpe_ertrag_heizen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'heat_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentyieldpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Wärmepumpe Strom Warmwasser"
        unique_id: waermepumpe_strom_warmwasser
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'hwc_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentconsumedpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Wärmepumpe Ertrag Warmwasser"
        unique_id: waermepumpe_ertrag_warmwasser
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'hwc_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentyieldpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Wärmepumpe Strom Kühlen"
        unique_id: waermepumpe_strom_kuehlen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'cool_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentconsumedpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Wärmepumpe Ertrag Kühlen"
        unique_id: waermepumpe_ertrag_kuehlen
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% if states('sensor.heating_ebusd_hmu_rundatastatuscode') == 'cool_compressor_active' %}
            {{ states('sensor.heating_ebusd_hmu_currentyieldpower') | float(0) }}
          {% else %}
            0
          {% endif %}

      - name: "Heat Pump COP Heizen"
        unique_id: heat_pump_cop_heizen
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_heizen') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_heizen') | float(0) %}
          {% if power > 0 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:radiator

      - name: "Heat Pump COP Heizen (kumuliert)"
        unique_id: heat_pump_cop_heizen_cumulative
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_heizen_kumuliert') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_heizen_kumuliert') | float(0) %}
          {% if power > 0.05 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:radiator

      - name: "Heat Pump COP Warmwasser"
        unique_id: heat_pump_cop_warmwasser
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_warmwasser') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_warmwasser') | float(0) %}
          {% if power > 0 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:water-boiler

      - name: "Heat Pump COP Warmwasser (kumuliert)"
        unique_id: heat_pump_cop_warmwasser_cumulative
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_warmwasser_kumuliert') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_warmwasser_kumuliert') | float(0) %}
          {% if power > 0.05 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:water-boiler

      - name: "Heat Pump COP Kühlen"
        unique_id: heat_pump_cop_kuehlen
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_kuehlen') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_kuehlen') | float(0) %}
          {% if power > 0 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:snowflake

      - name: "Heat Pump COP Kühlen (kumuliert)"
        unique_id: heat_pump_cop_kuehlen_cumulative
        unit_of_measurement: ""
        state_class: measurement
        state: >
          {% set heat = states('sensor.waermepumpe_ertrag_kuehlen_kumuliert') | float(0) %}
          {% set power = states('sensor.waermepumpe_strom_kuehlen_kumuliert') | float(0) %}
          {% if power > 0.05 %}
            {{ (heat / power) | round(2) }}
          {% else %}
            0
          {% endif %}
        icon: mdi:snowflake

      - name: "Compressor Runtime per Start"
        unique_id: compressor_runtime_per_start
        unit_of_measurement: "h"
        state_class: measurement
        state: >
          {% set h = states('sensor.heating_ebusd_hmu_runstatscompressorhours') | float(0) %}
          {% set s = states('sensor.heating_ebusd_hmu_runstatscompressorstarts') | float(1) %}
          {{ (h / s) | round(2) }}
        icon: mdi:clock-outline

