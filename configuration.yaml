utility_meter:
  waermepumpe_stromverbrauch_taeglich:
    source: sensor.waermepumpe_stromverbrauch
    name: "Wärmepumpe Stromverbrauch (heute)"
    cycle: daily
  waermepumpe_waermeertrag_taeglich:
    source: sensor.waermepumpe_waermeertrag
    name: "Wärmepumpe Wärmeertrag (heute)"
    cycle: daily

